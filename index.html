<body>
    
    <h1> Register form</h1>
    <form action="/submit"> </form>
    <fieldset>
        <legend>Personal Information</legend>

        <input type="email">

        <input type="password">


     <br>

        <br>

    <br>

        <input type="name">
        

        <br>

        <select><option> IT </option>
                <option> Accounting</option>
                <option> Finance </option>
                <option> Khmer Literature </option>
                <option> English Literature </option>
                
        </select>

        
        <br>


        <label>Skill:</label>
        <input type="radio" name="gender" value="HTML"> HTML

        <input type="radio" name="gender" value="Javascript"> Javascript

        
        <br>

        
        <label>Upload Photos:</label>
        <input type="file">

    <br>


    <fieldset>
        <Legend> Additional Information</Legend>
        <label> Address:</label>


        <br>


        <textarea></textarea>

        
        <br>


        <label>Personal Website:</label>
        <input type="name">
        

        <br>

    </fieldset>


    <br>


    <input type="checkbox"> I agree to the registration terms
